<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bili Screenshot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="logo" width="24" height="24" />
    <span class="title">Bili Screenshot</span>
  </header>

  <p class="hint">页面内快捷键（可在设置页修改）：<br />
    截图 <kbd id="scCapture">…</kbd> · 连拍 <kbd id="scBurst">…</kbd> · 复制 <kbd id="scCopy">…</kbd></p>
  <p class="hint">系统级快捷键（在浏览器"扩展快捷键"中修改）：<br />
    截图 <kbd id="sysCapture">…</kbd> · 连拍 <kbd id="sysBurst">…</kbd> · 复制 <kbd id="sysCopy">…</kbd></p>

  <div class="menu">
    <button type="button" id="historyBtn" class="menu-btn">截图历史</button>
    <button type="button" id="settingsBtn" class="menu-btn">设置</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
