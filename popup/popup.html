<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bili Screenshot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="logo" width="24" height="24" />
    <span class="title">Bili Screenshot</span>
  </header>

  <p class="hint">快捷键（可在扩展设置页修改）：<br />
    截图 <kbd>Ctrl+Shift+S</kbd> · 连拍 <kbd>Ctrl+Shift+X</kbd> · 复制 <kbd>Ctrl+Shift+Z</kbd></p>

  <div class="menu">
    <button type="button" id="historyBtn" class="menu-btn">截图历史</button>
    <button type="button" id="settingsBtn" class="menu-btn">设置</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
